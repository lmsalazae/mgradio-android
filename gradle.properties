# Project-wide Gradle settings.

# Memory settings for Gradle Daemon & Compiler
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

# Enable AndroidX and Jetifier
android.useAndroidX=true

# Enable Kotlin code style
kotlin.code.style=official

# Non-blocking Parallel execution
org.gradle.parallel=true
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.builtInKotlin=false
android.newDsl=false

# Suppress AGP deprecation warnings
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED

# Java Toolchain configuration: avoid incomplete JREs in /usr/lib/jvm
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=/usr/lib/jvm/java-latest-openjdk
